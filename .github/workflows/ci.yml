name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, types, tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ops
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: opsagents
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ops -d opsagents"
          --health-interval 2s --health-timeout 2s --health-retries 20
    env:
      OPS_TEST_DATABASE_URL: postgresql://ops:ci-only@localhost:5432/opsagents
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy (strict)
        run: mypy
      - name: Seed data is reproducible from its generator
        run: |
          python scripts/generate_seed.py
          git diff --exit-code -- data/ops_seed.json
      - name: Tests with coverage (including PostgreSQL checkpoints and ledger)
        run: pytest --cov --cov-report=term-missing --cov-fail-under=90
      - name: Evaluation gate (reference brain and misbehaving brain)
        run: opsagents eval --check --report eval-report.md
      - name: Demo runs end to end
        run: opsagents demo

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[postgres,otel]" pip-audit
      - name: pip-audit
        run: pip-audit --skip-editable

  docker:
    name: Container with PostgreSQL survives a restart mid-approval
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack
        run: |
          docker compose up -d --build --wait
          curl -fsS localhost:8080/healthz
      - name: Ticket pauses for approval, API restarts, approval completes
        run: |
          set -euo pipefail
          H=(-H 'content-type: application/json')
          RUN=$(curl -fsS localhost:8080/v1/tickets "${H[@]}" -H 'X-Customer-Id: C-1003' \
            -d '{"ticket_id": "T-4242", "subject": "Credit", "body": "AF-24003 is two days late. We expect the SLA credit."}')
          echo "$RUN"
          echo "$RUN" | grep -q '"status":"awaiting_approval"'
          ID=$(echo "$RUN" | python -c 'import json,sys; print(json.load(sys.stdin)["run_id"])')
          docker compose restart api
          for i in $(seq 1 30); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          STAFF=(-H 'X-User-Id: u-ci' -H 'X-User-Groups: ops-staff,ops-approvers')
          curl -fsS "localhost:8080/v1/runs/$ID" "${STAFF[@]}" | grep -q '"status":"awaiting_approval"'
          DONE=$(curl -fsS "localhost:8080/v1/runs/$ID/approval" "${H[@]}" "${STAFF[@]}" -d '{"approved": true}')
          echo "$DONE" | grep -q '"status":"resolved"'
          echo "$DONE" | grep -q '"tool":"issue_credit"'
      - name: Logs
        if: always()
        run: docker compose logs api || true
